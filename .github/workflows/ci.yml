name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm install
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint (security plugin)
        run: |
          npm install --no-save eslint eslint-plugin-security@^3
          npx eslint . --ext .js --rulesdir node_modules/eslint-plugin-security/rules || true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: CI=true npm run build
