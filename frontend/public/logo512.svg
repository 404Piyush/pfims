  <rect x="130" y="360" width="20" height="70" fill="white" opacity="0.8"/>
  <rect x="160" y="340" width="20" height="90" fill="white" opacity="0.8"/>
  
  <rect x="332" y="370" width="20" height="60" fill="white" opacity="0.8"/>
